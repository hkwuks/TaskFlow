<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TaskFlow task workflow</title>
  <desc id="desc">A dark terminal-style diagram showing task documents moving from planning to approval, implementation, checking and archive, with version recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172338"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 90H1200M0 91H1200" stroke="#26354b"/>
  <circle cx="34" cy="45" r="7" fill="#fb7185"/><circle cx="58" cy="45" r="7" fill="#fbbf24"/><circle cx="82" cy="45" r="7" fill="#34d399"/>
  <text x="112" y="52" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">taskflow / durable-task-history</text>
  <text x="48" y="140" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ taskflow run --task design-versioning</text>
  <text x="48" y="170" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">decision log: local markdown · no runtime hooks · archive before replace</text>
  <g filter="url(#shadow)">
    <rect x="48" y="220" width="180" height="92" rx="14" fill="#18263a" stroke="#334155"/>
    <rect x="270" y="220" width="180" height="92" rx="14" fill="#18263a" stroke="#334155"/>
    <rect x="492" y="220" width="180" height="92" rx="14" fill="#18263a" stroke="#334155"/>
    <rect x="714" y="220" width="180" height="92" rx="14" fill="#18263a" stroke="#334155"/>
    <rect x="936" y="220" width="216" height="92" rx="14" fill="#18343a" stroke="#2dd4bf"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">
    <text x="72" y="252">01  planning</text><text x="294" y="252">02  ready</text><text x="516" y="252">03  in_progress</text><text x="738" y="252">04  checking</text><text x="960" y="252">05  completed</text>
  </g>
  <g fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
    <text x="72" y="279">prd / spec / plan</text><text x="294" y="279">explicit approval</text><text x="516" y="279">one step at a time</text><text x="738" y="279">acceptance + review</text><text x="960" y="279">read-only history</text>
  </g>
  <g stroke="url(#accent)" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M228 266H264"/><path d="M450 266H486"/><path d="M672 266H708"/><path d="M894 266H930"/>
  </g>
  <path d="M804 320C804 372 520 372 520 320" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 8" fill="none"/>
  <text x="566" y="392" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">material change → archive old/vN → re-approve</text>
  <text x="48" y="365" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">recovery point: tasks/.../old/v1/</text>
</svg>
